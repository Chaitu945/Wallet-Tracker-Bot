name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the declared minimum (node-cron 4 requires it); 22 and 24 are the
        # LTS/current versions in use. Each job installs its own dependencies, so
        # this also verifies native modules like better-sqlite3 resolve per ABI.
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npx eslint .
